[project]
name = "microgrid-api"
version = "0.1.0"
description = "SNLG platform service layer: FastAPI + RQ worker (depends on microgrid-planner)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "rq>=1.16",
    "boto3>=1.42",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    # engine (path dependency; see [tool.uv.sources] or install -e ..)
    "microgrid-planner",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "moto[s3]>=5.0",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises the real microgrid.community_load.synthetic engine on fixture data",
]

# When the engine lives at .. (repo root pyproject):
# [tool.uv.sources]
# microgrid-planner = { path = "..", editable = true }
