name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      # Engine tests run on the installed package and synthetic fixtures only (no real data in CI).
      - run: pytest -q --cov=microgrid --cov-report=term-missing -m "not integration"

  api:
    runs-on: ubuntu-latest
    if: false                                       # enable at Phase 2
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: microgrid, POSTGRES_PASSWORD: microgrid, POSTGRES_DB: microgrid_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U microgrid" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install uv && cd api && uv pip install --system -e . -e .. ".[dev]"
      - run: cd api && alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: cd api && pytest -q --cov=microgrid_api --cov-fail-under=85

  web:
    runs-on: ubuntu-latest
    if: false                                       # enable at Phase 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm --prefix web ci
      - run: npm --prefix web test -- --ci

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [engine]
    if: false                                       # enable at Phase 6
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up -d --build
      - run: ./deploy/tests/test_compose_smoke.sh
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
