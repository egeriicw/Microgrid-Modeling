name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      # Engine tests run on the installed package and synthetic fixtures only (no real data in CI).
      - run: pytest -q --cov=microgrid --cov-report=term-missing -m "not integration"

  api:
    runs-on: ubuntu-latest
    # Postgres-only tests (migration round trip + model parity, concurrent claim, CRUD) are opt-in via
    # MICROGRID_TEST_DATABASE_URL; without it they skip, so the service and the variable must stay together.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: microgrid, POSTGRES_PASSWORD: microgrid, POSTGRES_DB: microgrid_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U microgrid" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      UV_PYTHON: "3.12"
      # CI-only throwaway credentials for the ephemeral service container above; not a secret.
      MICROGRID_TEST_DATABASE_URL: postgresql+psycopg://microgrid:microgrid@localhost:5432/microgrid_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv
      # api/uv.lock pins the api deps and installs the engine (..) as an editable path dependency.
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev ruff format --check .
      - run: uv run --locked --extra dev mypy
      # The shipped migration entry point must take an empty Postgres to head. It uses the server's default
      # `postgres` database so it cannot interfere with the test database. The upgrade/downgrade/upgrade round
      # trip itself runs in pytest (test_round_trip_and_parity_postgres); there is no downgrade CLI.
      - name: migrate an empty Postgres database to head
        env:
          MICROGRID_DATABASE_URL: postgresql+psycopg://microgrid:microgrid@localhost:5432/postgres
        run: uv run --locked --extra dev python -m microgrid_api.db.migrate
      - run: uv run --locked --extra dev pytest -q --cov=microgrid_api --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Static validation: needs no running containers. The env template holds development-only values.
      - run: docker compose --project-directory . --env-file deploy/.env.example -f deploy/docker-compose.yml config -q
      - run: docker compose --project-directory . --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml config -q
      # GitHub-hosted runners include Docker. Blocking: a failed api image build fails CI.
      - run: docker compose --project-directory . --env-file deploy/.env.example -f deploy/docker-compose.yml build api

  # End to end on GitHub's Docker: build all images, start the whole stack with generated synthetic fixture data, and
  # prove a run goes API -> Redis -> worker -> stored result, with the web image proxying /api/ (see the smoke script).
  compose-smoke:
    runs-on: ubuntu-latest
    needs: [engine]
    timeout-minutes: 30
    env:
      SMOKE_CI: "1"
      SMOKE_TIMEOUT: "300"
      SMOKE_RUN_TIMEOUT: "300"
      # The runner's free disk is not the owner's Mac. The guard still runs and announces this lower threshold;
      # the df step below records what the runner really had [verify GitHub runner disk size].
      PREFLIGHT_MIN_FREE_GB: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      # Synthetic data only (no real data in CI); git-ignored, mounted read-only at /data by the CI overlay.
      - name: generate synthetic fixture data
        run: python deploy/ci/make_fixture_data.py tests/fixtures/data
      - name: free disk before
        run: df -h /
      - name: smoke (build, start, health, ready incl. data files, unset settings absent, web proxy, run + custom composition to succeeded, results, SSE)
        run: ./deploy/tests/test_compose_smoke.sh
      - name: image sizes (linux/amd64 on the runner, not the owner's arm64 Mac)
        if: always()
        run: docker image ls --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' && df -h /
      - name: container logs on failure
        if: failure()
        run: docker compose --project-directory . --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml --project-name microgrid-smoke ps -a; docker compose --project-directory . --env-file deploy/.env.example -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml --project-name microgrid-smoke logs --no-color --timestamps
