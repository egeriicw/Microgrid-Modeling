# CI overlay (layered on docker-compose.yml): faster health polling, committed fixtures instead of real data.
#   docker compose --project-directory . --env-file deploy/.env.example \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up -d --build --wait
services:
  api:
    volumes:
      - ./tests/fixtures:/data:ro
  worker:
    volumes:
      - ./tests/fixtures:/data:ro
  db:
    healthcheck:
      interval: 2s
      retries: 60
  redis:
    healthcheck:
      interval: 2s
      retries: 60
