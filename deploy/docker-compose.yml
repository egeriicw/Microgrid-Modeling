# Community Energy Profiler: local stack (FR-PLAT-4, FR-DATA-4). Targets Apple-silicon Docker Desktop.
# Run from the repo root (Makefile does this):
#   cp deploy/.env.example deploy/.env
#   docker compose --project-directory . --env-file deploy/.env -f deploy/docker-compose.yml up -d --wait db redis web migrate api
# (the worker is a placeholder that exits until story 1.10, so `make up` does not start it)
# Relative paths below are relative to the repo root (--project-directory .).
name: microgrid

x-app-env: &app-env
  MICROGRID_ENVIRONMENT: production  # the API refuses to start without real settings
  MICROGRID_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-microgrid}:${POSTGRES_PASSWORD:?set in deploy/.env}@db:5432/${POSTGRES_DB:-microgrid}
  MICROGRID_REDIS_URL: redis://redis:6379/0
  MICROGRID_JWT_SECRET: ${JWT_SECRET:?set in deploy/.env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MICROGRID_DATA_DIR: /data
  MICROGRID_OUTPUT_DIR: /outputs

services:
  db:
    # PostgreSQL + PostGIS + TimescaleDB in one multi-arch image [verify exact tag and arm64 manifest with
    # `docker buildx imagetools inspect timescale/timescaledb-ha:pg17`; pin to a full tag once confirmed].
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-microgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-microgrid}
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: ${DB_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-microgrid} -d ${POSTGRES_DB:-microgrid}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes:
      - redisdata:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: applies database migrations (alembic upgrade head) then exits 0. api waits for it to complete.
  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      target: api
    image: microgrid-api:dev
    command: ["python", "-m", "microgrid_api.db.migrate"]
    restart: "no"
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      target: api
    image: microgrid-api:dev
    environment: *app-env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes:
      - ${MICROGRID_DATA_DIR:-./data}:/data:ro
      - outputs:/outputs
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    mem_limit: ${API_MEM_LIMIT:-1g}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      target: worker
    image: microgrid-worker:dev
    # Placeholder: exits with a clear message until story 1.10 adds microgrid_api.worker.
    environment: *app-env
    volumes:
      - ${MICROGRID_DATA_DIR:-./data}:/data:ro
      - outputs:/outputs
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: ${WORKER_MEM_LIMIT:-8g}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A microgrid_api.worker inspect ping -d celery@$$HOSTNAME -t 5"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    # Placeholder static page; the React build replaces it later.
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: ["127.0.0.1:${WEB_PORT:-3000}:8080"]
    volumes:
      - ./deploy/web/index.html:/usr/share/nginx/html/index.html:ro
      - ./deploy/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  outputs:
