# Community Energy Profiler: local stack (FR-PLAT-4, FR-DATA-4). Targets Apple-silicon Docker Desktop.
# Run from the repo root (Makefile does this):
#   cp deploy/.env.example deploy/.env
#   docker compose --project-directory . --env-file deploy/.env -f deploy/docker-compose.yml up -d --build --wait db redis migrate api worker web
# Relative paths below are relative to the repo root (--project-directory .).
name: microgrid

x-app-env: &app-env
  MICROGRID_ENVIRONMENT: production  # the API refuses to start without real settings
  MICROGRID_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-microgrid}:${POSTGRES_PASSWORD:?set in deploy/.env}@db:5432/${POSTGRES_DB:-microgrid}
  MICROGRID_REDIS_URL: redis://redis:6379/0
  MICROGRID_JWT_SECRET: ${JWT_SECRET:?set in deploy/.env}
  # JSON list of {"subject","role","key"}; production Settings refuse to start without it (migrate, api AND worker).
  MICROGRID_API_KEYS: ${API_KEYS:?set in deploy/.env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MICROGRID_DATA_DIR: /data
  MICROGRID_OUTPUT_DIR: /outputs
  # Owner-tunable settings, documented in deploy/.env.example. PASS-THROUGH form (a name with no value): the value
  # comes from the shell or deploy/.env; a line that is unset or commented out there leaves the variable ABSENT in
  # the container, so the API uses its own default. Never give these a `${...:-}` default: an empty string counts as
  # "set" and the API refuses it (a temperature setting the chosen source does not use is a startup error).
  # deploy/check-env.sh refuses MICROGRID_* names in deploy/.env that are not in this list (typos would be dropped).
  MICROGRID_RESSTOCK_CHARS_FILE:
  MICROGRID_COMSTOCK_CHARS_FILE:
  MICROGRID_TEMPERATURE_SOURCE:
  MICROGRID_TEMPERATURE_COLUMN:
  MICROGRID_TEMPERATURE_UNITS:
  MICROGRID_TEMPERATURE_WEATHER_FILE:
  MICROGRID_TEMPERATURE_TIME_COLUMN:
  MICROGRID_MAX_REQUEST_BYTES:
  MICROGRID_PERMISSION_OVERRIDES:

services:
  db:
    # PostgreSQL + PostGIS + TimescaleDB in one multi-arch image [verify exact tag and arm64 manifest with
    # `docker buildx imagetools inspect timescale/timescaledb-ha:pg17`; pin to a full tag once confirmed].
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-microgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-microgrid}
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: ${DB_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-microgrid} -d ${POSTGRES_DB:-microgrid}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes:
      - redisdata:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: applies database migrations (alembic upgrade head) then exits 0. api waits for it to complete.
  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      target: api
    image: microgrid-api:dev
    command: ["python", "-m", "microgrid_api.db.migrate"]
    restart: "no"
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      target: api
    image: microgrid-api:dev
    environment: *app-env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes:
      - ${MICROGRID_DATA_DIR:-./data}:/data:ro
      - outputs:/outputs
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    mem_limit: ${API_MEM_LIMIT:-1g}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Celery worker: runs engine jobs from the Redis queue and (embedded beat) the stuck-run reaper. Exactly one.
  worker:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
      target: worker
    image: microgrid-worker:dev
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - ${MICROGRID_DATA_DIR:-./data}:/data:ro
      - outputs:/outputs
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    mem_limit: ${WORKER_MEM_LIMIT:-8g}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A microgrid_api.worker inspect ping -d celery@$$HOSTNAME -t 5"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s

  # The React app (Vite build) behind unprivileged nginx. nginx also proxies /api/ to the api service, so the browser
  # talks to one origin (http://127.0.0.1:3000) and the app uses its default base URL /api/v1.
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      target: web
    image: microgrid-web:dev
    ports: ["127.0.0.1:${WEB_PORT:-3000}:8080"]
    mem_limit: 64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  outputs:
