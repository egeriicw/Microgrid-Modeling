# SNLG Platform — local / dev / CI orchestration.
# See docs/infrastructure.md. Non-goal: production/k8s (docs §9 is advisory).
#
#   cp deploy/.env.example deploy/.env   &&   docker compose -f deploy/docker-compose.yml up
#
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-microgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microgrid}
      POSTGRES_DB: ${POSTGRES_DB:-microgrid}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-microgrid} -d ${POSTGRES_DB:-microgrid}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-microgrid}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-microgrid-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY:-microgrid}" "$${S3_SECRET_KEY:-microgrid-secret}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET:-snlg-artifacts}" &&
        echo "bucket ready" && exit 0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-microgrid}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-microgrid-secret}
      S3_BUCKET: ${S3_BUCKET:-snlg-artifacts}

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-microgrid}:${POSTGRES_PASSWORD:-microgrid}@db:5432/${POSTGRES_DB:-microgrid}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    # entrypoint runs `alembic upgrade head` then uvicorn (see api/Dockerfile)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["python", "-m", "microgrid_api.worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-microgrid}:${POSTGRES_PASSWORD:-microgrid}@db:5432/${POSTGRES_DB:-microgrid}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      DATA_DIR: /data
    volumes:
      - ../data:/data:ro
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
