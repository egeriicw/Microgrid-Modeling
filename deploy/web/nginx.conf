# Web container: serves the Vite build (single-page app) and proxies /api/ to the api service, so the browser sees one
# origin. Loaded as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged (port 8080, non-root).
#
# Security headers are set ONCE, at server level. nginx drops every inherited add_header in a location that has its own
# add_header, so no location below may use add_header (a test enforces this). Caching uses `expires` instead.
# CSP: style-src allows 'unsafe-inline' because MUI/Emotion inject <style> tags at run time; scripts are 'self' only.

server_tokens off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Docker's embedded DNS. With a variable in proxy_pass nginx resolves `api` per request (re-resolving after an api
  # restart) and still starts when the api is down (requests then get 502). A variable proxy_pass without a URI part
  # passes the original request URI unchanged, so /api/v1/... reaches the api as /api/v1/...
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-Sent Events (/api/v1/runs/{id}/events): stream each event as it arrives, keep idle streams open.
    # The api sends a ping every 15 s; the timeout is the longest a stream may stay silent.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_connect_timeout 5s;
    gzip off;
  }

  # Hashed build assets never change under the same name: cache them for a long time.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # index.html must always be revalidated so a new build is picked up.
  location = /index.html {
    expires -1;
  }

  # Single-page app: unknown paths (client-side routes such as /runs/123) get index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
