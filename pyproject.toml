[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microgrid-planner"
version = "0.1.0"
description = "Community energy profiling: Monte-Carlo neighborhood load from NREL ResStock/ComStock."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.5",   # pandas.read_excel for the ResStock/ComStock characteristics workbooks
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-pyyaml",
]
notebooks = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"microgrid.community_load" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires parquet data files (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks", "web", "api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E702"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["microgrid.community_load.categorize.CategoryRules"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
