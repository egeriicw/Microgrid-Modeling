scenario:
  name: 
    - "DC Multifamily Baseline"
  description: 
    - "100% multifamily residential neighborhood in Washington DC. Baseline (upgrade=0), no perturbations, fixed 50 runs. Matches the original notebook configuration for parity testing."

rng:
  composition_seed: 1001
  archetype_seed: 2002
  perturbation_seed: 3003

data:
  upgrade: "0"
  state: DC
  resstock_chars_file: DC_upgrade0.xlsx
  comstock_chars_file: DC_upgrade0_agg.xlsx
  resstock_timeseries_dir: ../data/input/resstock/timeseries_individual_buildings
  comstock_timeseries_dir: ../data/input/comstock/timeseries_individual_buildings
  background_dir: ../data/background

composition:
  total_buildings: 10
  method: dirichlet          # or uniform_renorm
  dirichlet_concentration: 5.0
  categories:
    mf_small:
      min_fraction: 0.60
      max_fraction: 0.85
      source: resstock
    mf_mid:
      min_fraction: 0.10
      max_fraction: 0.40
      source: resstock
    mf_large:
      min_fraction: 0.00
      max_fraction: 0.10
      source: resstock
    commercial_private:
      fixed_count: 4          # always 4 commercial buildings
      source: comstock

archetype_filters:
  resstock:
    mf_small:
      building_type_heights:
        - "Multi-Family with 2 - 4 Units"
        - "Multi-Family with 5+ Units, 1-3 Stories"
      require_data_complete: true
    mf_mid:
      building_type_heights:
        - "Multi-Family with 5+ Units, 4-7 Stories"
      require_data_complete: true
    mf_large:
      building_type_heights:
        - "Multi-Family with 5+ Units, 8+ Stories"
      require_data_complete: true
  comstock:
    commercial_private:
      building_types:
        - SmallOffice
        - MediumOffice
        - Outpatient
      include_public: false

feasibility:
  hard:
    peak_kw:
      min: 5.0
      max: 50000.0
    annual_energy_kwh:
      min: 1000.0
      max: 100000000.0
    load_factor:
      min: 0.05
      max: 0.99
  soft:
    weights:
      peak_kw: 1.0
      load_factor: 2.0
    bounds:
      peak_kw:
        min: 50.0
        max: 5000.0
      load_factor:
        min: 0.20
        max: 0.80

perturbation:
  enabled: false             # matches original notebook; flip to true to activate
  max_temporal_shift_hours: 2
  energy_tolerance: 0.05
  end_use_factors:
    lighting:
      sigma: 0.10
    plug_loads:
      sigma: 0.15
    hvac:
      sigma: 0.12
    hot_water:
      sigma: 0.08

ensemble:
  mode: fixed                # or adaptive
  min_runs: 20
  max_runs: 50
  check_every: 10

convergence:
  lookback_window: 10
  min_stable_window: 10
  epsilon: 0.01
  metrics:
    - peak_kw
    - annual_energy_kwh
    - load_factor

validation:
  benchmarks:
    peak_demand_kw: [50, 5000]    # set to null to skip
    load_factor: [0.20, 0.80]
  min_cv_peak: 0.01

output:
  base_dir: ../data/output/scenario_runs
  per_run_csvs: true
  percentiles: [0.10, 0.50, 0.90]
  representative_cases: true
  validation_report: true
  preserve_legacy_format: true
