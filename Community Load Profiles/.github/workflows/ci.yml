name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff black
      - run: ruff check src tests || true          # TODO Phase 6: drop `|| true`
      - run: black --check src tests || true

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install uv
      # Phase 1: replace with `pip install -e ./snlg` once packaged (FR-E1)
      - run: PYTHONPATH=src uv run --with pytest --with pytest-cov pytest -q tests
      # Phase 1 exit: add --cov=snlg --cov-fail-under=90 and `-m "not integration"` + a separate integration run

  api:
    runs-on: ubuntu-latest
    if: false                                       # enable at Phase 2
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: microgrid, POSTGRES_PASSWORD: microgrid, POSTGRES_DB: microgrid_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U microgrid" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install uv && cd api && uv pip install --system -e . -e ../snlg ".[dev]"
      - run: cd api && alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: cd api && pytest -q --cov=microgrid_api --cov-fail-under=85

  web:
    runs-on: ubuntu-latest
    if: false                                       # enable at Phase 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm --prefix web ci
      - run: npm --prefix web test -- --ci

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [engine]
    if: false                                       # enable at Phase 6
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up -d --build
      - run: ./deploy/tests/test_compose_smoke.sh
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
